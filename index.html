<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>氷の城壁 情報室</title>
    <meta
      name="description"
      content="氷の城壁に関する公式情報を検索、分類、位置情報、予約可否つきで管理する個人用ファンサイト。"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-labelledby="site-title">
        <div class="hero-copy">
          <p class="eyebrow">公式情報だけを集めるファン情報室</p>
          <h1 id="site-title">氷の城壁 情報室</h1>
          <p class="lead">
            公式Xと公式サイト由来の情報をピックアップし、コラボ、新商品、場所、予約可否まで一画面で検索できます。
          </p>
          <div class="source-board" aria-label="公式情報ソース">
            <span>アニメ公式X @korinojoheki_pr</span>
            <span>システムサービス公式X/導入店一覧</span>
            <span>公式サイト/公式ニュース</span>
            <span>個人ユーザー投稿は保存しない</span>
          </div>
        </div>
        <div class="hero-portrait" aria-label="メインビジュアル">
          <img src="./main-visual.jpg" alt="氷の城壁 情報室のメインビジュアル" />
        </div>
      </section>

      <section class="command-band" aria-label="検索と公式ソース確認">
        <label class="search-tool" for="site-search">
          <span>情報検索</span>
          <input id="site-search" type="search" placeholder="カフェ、予約可能、東京、クレーンゲーム..." />
        </label>
        <div class="monitor-tool">
          <div>
            <p class="tool-label">公式ソースピックアップ</p>
            <strong id="last-checked">最終確認 未確認</strong>
          </div>
          <button class="button primary" id="refresh-button" type="button">確認</button>
        </div>
      </section>

      <section class="metric-strip" aria-label="状態別件数">
        <div class="metric metric-active"><span>開催中</span><strong id="metric-ongoing">0</strong></div>
        <div class="metric metric-upcoming"><span>開催前</span><strong id="metric-upcoming">0</strong></div>
        <div class="metric metric-reserve"><span>予約可能</span><strong id="metric-reserve">0</strong></div>
        <div class="metric metric-place"><span>登録地点</span><strong id="metric-place">0</strong></div>
      </section>

      <section class="filters" aria-label="ジャンルと位置情報フィルター">
        <label>
          <span>大分類</span>
          <select id="category-filter">
            <option value="all">すべて</option>
            <option value="official">公式情報</option>
            <option value="collab">コラボ</option>
            <option value="product">新商品</option>
          </select>
        </label>
        <label>
          <span>状態</span>
          <select id="status-filter">
            <option value="all">すべて</option>
            <option value="ongoing">開催中</option>
            <option value="upcoming">開催前</option>
            <option value="ended">記録</option>
          </select>
        </label>
        <label>
          <span>ジャンル</span>
          <select id="subcategory-filter"></select>
        </label>
        <label>
          <span>地域</span>
          <select id="area-filter"></select>
        </label>
        <label>
          <span>予約</span>
          <select id="reservation-filter">
            <option value="all">すべて</option>
            <option value="available">予約可能</option>
            <option value="notNeeded">予約不要</option>
            <option value="closed">予約終了</option>
          </select>
        </label>
      </section>

      <section class="pickup-band" aria-label="最新ピックアップ">
        <div class="pickup-visual" id="pickup-visual"></div>
        <div class="pickup-copy">
          <p class="eyebrow">最新ピックアップ</p>
          <h2 id="pickup-title">読み込み中</h2>
          <p id="pickup-summary"></p>
          <div class="pickup-meta" id="pickup-meta"></div>
        </div>
      </section>

      <div class="content-grid">
        <section class="timeline" aria-label="情報一覧">
          <section class="timeline-section">
            <div class="section-heading"><h2>開催中</h2><span id="count-ongoing">0件</span></div>
            <div class="card-grid" id="ongoing-list"></div>
          </section>
          <section class="timeline-section">
            <div class="section-heading"><h2>開催前</h2><span id="count-upcoming">0件</span></div>
            <div class="card-grid" id="upcoming-list"></div>
          </section>
          <section class="timeline-section">
            <div class="section-heading"><h2>記録</h2><span id="count-ended">0件</span></div>
            <div class="card-grid" id="ended-list"></div>
          </section>
        </section>

        <aside class="side-tools" aria-label="管理ツール">
          <section class="tool-card">
            <h2>位置情報</h2>
            <div class="map-frame" aria-hidden="true">
              <span class="pin pin-1"></span><span class="pin pin-2"></span><span class="pin pin-3"></span>
              <span class="pin pin-4"></span><span class="pin pin-5"></span><span class="pin pin-6"></span>
            </div>
            <div id="location-list" class="location-list"></div>
          </section>
          <section class="tool-card">
            <h2>リサーチ保留</h2>
            <div id="bookmark-list" class="research-list">
              <p class="quiet-text">保存した情報がここに残ります。</p>
            </div>
          </section>
        </aside>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
